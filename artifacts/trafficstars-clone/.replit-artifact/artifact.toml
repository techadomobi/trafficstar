kind = "web"
previewPath = "/"
title = "AdoMobi Clone"
version = "1.0.0"
id = "artifacts/AdoMobi-clone"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22435

[services.development]
run = "pnpm --filter @workspace/AdoMobi-clone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/AdoMobi-clone", "run", "build" ]
publicDir = "artifacts/AdoMobi-clone/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22435"
BASE_PATH = "/"
